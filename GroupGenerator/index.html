<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Generator</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .row > label { flex: 1 1 18rem; }
  textarea { width: 100%; height: 12rem; box-sizing: border-box; }
  #groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: 1rem; margin-top: 1rem; }
  .group { border: 1px solid #888; border-radius: 6px; padding: .5rem 1rem; }
  .error { color: #b00020; }
</style>
</head>
<body>
<h1>Group Generator</h1>
<div class="row">
  <label>Names, one per line, optional gender after a comma
    <textarea id="names" placeholder="Ann, F&#10;Bob, M&#10;Cam"></textarea>
  </label>
  <label>Can't share a group, one pair per line
    <textarea id="pairs" placeholder="Ann, Bob"></textarea>
  </label>
</div>
<p>
  <label>Groups <input id="count" type="number" min="1" value="2" style="width:4rem"></label>
  <label><input id="mix" type="checkbox"> Evenly mix genders</label>
  <button id="go">Generate</button>
</p>
<p id="error" class="error" role="alert"></p>
<div id="groups"></div>
<script src="groups.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const KEY = "group-generator-settings";
  const fields = ["names", "pairs", "count"];
  const save = () => {
    const data = Object.fromEntries(fields.map((f) => [f, $(f).value]));
    data.mix = $("mix").checked;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
  };
  try {
    const data = JSON.parse(localStorage.getItem(KEY) || "{}");
    for (const f of fields) if (data[f] !== undefined) $(f).value = data[f];
    $("mix").checked = !!data.mix;
  } catch {}
  for (const id of [...fields, "mix"]) $(id).addEventListener("input", save);
  $("go").onclick = () => {
    $("error").textContent = "";
    $("groups").replaceChildren();
    try {
      const { parseNames, parseConflicts, generateGroups } = GroupGenerator;
      const people = parseNames($("names").value);
      const pairs = parseConflicts($("pairs").value, people);
      const groups = generateGroups(people, parseInt($("count").value, 10), pairs, $("mix").checked);
      groups.forEach((g, i) => {
        const div = document.createElement("div");
        div.className = "group";
        const h = document.createElement("h3");
        h.textContent = `Group ${i + 1}`;
        const ul = document.createElement("ul");
        for (const p of g) ul.append(Object.assign(document.createElement("li"), { textContent: p.name }));
        div.append(h, ul);
        $("groups").append(div);
      });
    } catch (e) {
      $("error").textContent = e.message;
    }
  };
</script>
</body>
</html>
